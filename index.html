<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Warp Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #180101;
        }
        #container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="mainCanvas"></canvas>
        <canvas id="bloomCanvas" style="display: none;"></canvas>
    </div>

    <script>
        // Animation parameters (will be updated via postMessage)
        const params = {
            starCount: 500,
            baseSpeed: 0.001,
            speedVariation: 0.003,
            centerRadius: 0.24,
            streakLength: 1500,
            starSize: 2.5,
            primaryIntensity: 1.0,
            trailOpacity: 0.15,
            highContrast: false,
            bloomEnabled: false,
            bloomIntensity: 0.05,
            backgroundColor: "#180101",
            backgroundOpacity: 1,
            primaryColor: "#8f3e00",
            secondaryColor: "#FFA64D"
        };

        // Animation state
        const stars = [];
        let animationId = 0;
        let isRunning = true;
        let frameCount = 0;

        // Get canvas elements
        const mainCanvas = document.getElementById('mainCanvas');
        const bloomCanvas = document.getElementById('bloomCanvas');
        const ctx = mainCanvas.getContext('2d');
        const bloomCtx = bloomCanvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            mainCanvas.width = width;
            mainCanvas.height = height;
            bloomCanvas.width = width;
            bloomCanvas.height = height;
            
            // Reinitialize stars after resize
            initializeStars();
        }

        // Create a new star
        function createNewStar(centerX, centerY) {
            const angle = Math.random() * Math.PI * 2;
            const minDistance = params.centerRadius;
            const distance = Math.random() * (1 - minDistance) + minDistance;
            const x = centerX + Math.cos(angle) * distance * centerX;
            const y = centerY + Math.sin(angle) * distance * centerY;

            return {
                x,
                y,
                z: Math.random() * 0.9 + 0.1,
                speed: Math.random() * params.speedVariation + params.baseSpeed,
                colorType: Math.random() > 0.7 ? 0 : 1
            };
        }

        // Initialize stars
        function initializeStars() {
            const centerX = mainCanvas.width / 2;
            const centerY = mainCanvas.height / 2;
            
            // Clear stars array
            stars.length = 0;
            
            // Create new stars
            for (let i = 0; i < params.starCount; i++) {
                stars.push(createNewStar(centerX, centerY));
            }
        }

        // Apply bloom effect
        function applyBloom() {
            if (!params.bloomEnabled) return;

            // Scale the blur radius based on bloom intensity
            const blurRadius = Math.floor(params.bloomIntensity * 10) + 2;

            // Apply multiple blur passes for a smoother bloom
            for (let i = 0; i < 3; i++) {
                bloomCtx.filter = `blur(${blurRadius}px)`;
                bloomCtx.drawImage(bloomCanvas, 0, 0);
            }

            // Reset filter
            bloomCtx.filter = "none";

            // Composite the bloom onto the main canvas
            ctx.globalCompositeOperation = "lighter";
            ctx.drawImage(bloomCanvas, 0, 0);
            ctx.globalCompositeOperation = "source-over";
        }

        // Animation loop
        function animate() {
            if (!isRunning) return;
            
            frameCount++;

            const width = mainCanvas.width;
            const height = mainCanvas.height;
            
            if (width === 0 || height === 0) {
                // Skip rendering if canvas has no dimensions yet
                animationId = requestAnimationFrame(animate);
                return;
            }
            
            const centerX = width / 2;
            const centerY = height / 2;

            // Parse background color to RGB
            const r = parseInt(params.backgroundColor.slice(1, 3), 16);
            const g = parseInt(params.backgroundColor.slice(3, 5), 16);
            const b = parseInt(params.backgroundColor.slice(5, 7), 16);

            // Clear canvas with trail effect and background color
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${params.trailOpacity * params.backgroundOpacity})`;
            ctx.fillRect(0, 0, width, height);

            // Clear bloom canvas completely each frame
            if (params.bloomEnabled) {
                bloomCtx.clearRect(0, 0, width, height);
            }

            // Update and draw stars
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];

                // Update position - move outward from center
                star.z -= star.speed;

                // If star goes out of screen, reset it
                if (star.z < 0.1) {
                    stars[i] = createNewStar(centerX, centerY);
                    continue;
                }

                // Calculate screen position
                const x = (star.x - centerX) / star.z + centerX;
                const y = (star.y - centerY) / star.z + centerY;

                // Calculate streak length based on speed, z position, and streak length parameter
                const streakLengthFactor = params.streakLength / 50; // Normalize to make 50 the baseline

                // Calculate previous position for line drawing, incorporating streak length
                const prevZ = star.z + star.speed * streakLengthFactor;
                const prevX = (star.x - centerX) / prevZ + centerX;
                const prevY = (star.y - centerY) / prevZ + centerY;

                // Calculate size based on z position
                const size = params.starSize * (1 - star.z);

                // Calculate color based on z position and star type
                const brightness = Math.min(255, Math.floor(255 * (1 - star.z) * 2));
                const alpha = Math.min(1, (1 - star.z) * 3);

                // Z-position factor for bloom intensity (closer = more bloom)
                const zFactor = 1 - star.z;

                // Extract RGB components
                const primaryR = parseInt(params.primaryColor.slice(1, 3), 16);
                const primaryG = parseInt(params.primaryColor.slice(3, 5), 16);
                const primaryB = parseInt(params.primaryColor.slice(5, 7), 16);

                const secondaryR = parseInt(params.secondaryColor.slice(1, 3), 16);
                const secondaryG = parseInt(params.secondaryColor.slice(3, 5), 16);
                const secondaryB = parseInt(params.secondaryColor.slice(5, 7), 16);

                // Apply brightness to colors
                let r, g, b;
                const brightnessFactor = brightness / 255;

                if (params.highContrast) {
                    // High contrast mode - more distinct colors
                    if (star.colorType === 0) {
                        r = Math.floor(primaryR * brightnessFactor);
                        g = Math.floor(primaryG * brightnessFactor);
                        b = Math.floor(primaryB * brightnessFactor);
                    } else {
                        r = Math.floor(secondaryR * brightnessFactor);
                        g = Math.floor(secondaryG * brightnessFactor);
                        b = Math.floor(secondaryB * brightnessFactor);
                    }
                } else {
                    // Normal mode - more subtle blending
                    if (star.colorType === 0) {
                        r = Math.floor(primaryR * brightnessFactor);
                        g = Math.floor(primaryG * brightnessFactor);
                        b = Math.floor(primaryB * brightnessFactor);
                    } else {
                        // Blend with primary color for a more subtle effect
                        const blendFactor = 0.2;
                        r = Math.floor((secondaryR * (1 - blendFactor) + primaryR * blendFactor) * brightnessFactor);
                        g = Math.floor((secondaryG * (1 - blendFactor) + primaryG * blendFactor) * brightnessFactor);
                        b = Math.floor(
                            (secondaryB * (1 - blendFactor) + primaryB * blendFactor) *
                            brightnessFactor *
                            params.primaryIntensity
                        );
                    }
                }

                // Draw streak on main canvas
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(prevX, prevY);
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.lineWidth = size * (star.colorType === 0 ? 1.5 : 1);
                ctx.stroke();

                // Draw streak on bloom canvas if bloom is enabled
                if (params.bloomEnabled) {
                    // Make bloom more intense for closer stars (z-position dependent)
                    const bloomAlpha = alpha * zFactor * params.bloomIntensity;

                    bloomCtx.beginPath();
                    bloomCtx.moveTo(x, y);
                    bloomCtx.lineTo(prevX, prevY);
                    bloomCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${bloomAlpha})`;

                    // Make bloom streaks thicker
                    bloomCtx.lineWidth = size * (star.colorType === 0 ? 2 : 1.5);
                    bloomCtx.stroke();
                }
            }

            // Apply bloom effect if enabled
            if (params.bloomEnabled) {
                applyBloom();
            }

            // Continue animation loop
            animationId = requestAnimationFrame(animate);
        }

        // Start/stop animation functions
        function startAnimation() {
            if (isRunning) return;
            isRunning = true;
            animationId = requestAnimationFrame(animate);
            console.log("Animation started");
        }

        function stopAnimation() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = 0;
            }
            console.log("Animation stopped");
        }

        // Listen for messages from parent (Framer)
        window.addEventListener('message', function(event) {
            try {
                // Update parameters
                if (event.data && event.data.type === 'updateParams') {
                    const newParams = event.data.params;
                    
                    // Update each parameter
                    for (const key in newParams) {
                        if (params.hasOwnProperty(key)) {
                            params[key] = newParams[key];
                        }
                    }
                    
                    // Reinitialize stars if count changed
                    if (newParams.hasOwnProperty('starCount') && stars.length !== params.starCount) {
                        initializeStars();
                    }
                    
                    // Update background color
                    if (newParams.hasOwnProperty('backgroundColor') || newParams.hasOwnProperty('backgroundOpacity')) {
                        const r = parseInt(params.backgroundColor.slice(1, 3), 16);
                        const g = parseInt(params.backgroundColor.slice(3, 5), 16);
                        const b = parseInt(params.backgroundColor.slice(5, 7), 16);
                        document.body.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${params.backgroundOpacity})`;
                    }
                }
            } catch (error) {
                console.error("Error processing message:", error);
            }
        });

        // Handle visibility change
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                stopAnimation();
            } else {
                startAnimation();
            }
        });

        // Initialize and start animation
        window.addEventListener('load', function() {
            // Set initial background color
            const r = parseInt(params.backgroundColor.slice(1, 3), 16);
            const g = parseInt(params.backgroundColor.slice(3, 5), 16);
            const b = parseInt(params.backgroundColor.slice(5, 7), 16);
            document.body.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${params.backgroundOpacity})`;
            
            // Initialize canvas and stars
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Start animation with a slight delay to ensure everything is ready
            setTimeout(() => {
                animate();
                
                // Notify parent that we're ready
                if (window.parent && window.parent !== window) {
                    try {
                        window.parent.postMessage({ type: 'ready' }, '*');
                    } catch (e) {
                        console.log("Could not notify parent frame", e);
                    }
                }
            }, 100);
        });
    </script>
</body>
</html>
